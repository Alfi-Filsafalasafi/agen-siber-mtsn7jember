<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agen Siber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/game.css" rel="stylesheet">
  <link href="css/briefing.css" rel="stylesheet">
  <link href="css/room4.css" rel="stylesheet">
  <link href="css/room5.css" rel="stylesheet">
  <link href="css/materi.css" rel="stylesheet">
  <link href="css/hasil.css" rel="stylesheet">
  <link href="css/portal.css" rel="stylesheet">
</head>
<body>

<header class="topbar" id="topbar" hidden>
  <span class="brand">🕵️ Agen Siber</span>
  <span class="small text-secondary text-truncate" id="whoami"></span>
  <button class="btn btn-sm btn-outline-secondary" id="btnLogout">Keluar</button>
</header>

<main class="container py-4" style="max-width:860px">

  <!-- Landing -->
  <section class="screen text-center py-5" id="screen-landing">
    <div class="display-1">🕵️</div>
    <h1 class="mt-2">Agen Siber</h1>
    <p class="lead text-secondary">Digital Escape Room: Menggunakan Media Digital dengan Bijak</p>
    <p class="text-secondary">Selesaikan 5 ruangan, kumpulkan 5 kunci, dan buka Portal Digital.</p>
    <button class="btn btn-info btn-lg px-5 mt-3" id="btnStart">Mulai Misi</button>
  </section>

  <!-- Login -->
  <section class="screen" id="screen-login" hidden>
    <div class="panel mx-auto" style="max-width:440px">
      <h4 class="mb-3">Identitas Agen</h4>

      <!-- Langkah 1: password + kelas -->
      <form id="loginForm1" novalidate>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" autocomplete="off" placeholder="Password dari gurumu">
        </div>
        <div class="mb-3">
          <label class="form-label" for="kelas">Kelas</label>
          <select class="form-select" id="kelas"></select>
        </div>
        <button class="btn btn-info w-100" id="btnNext" type="submit">Lanjut</button>
      </form>

      <!-- Langkah 2: pilih nama -->
      <form id="loginForm2" novalidate hidden>
        <div class="small text-secondary mb-2" id="kelasInfo"></div>
        <div class="mb-3">
          <label class="form-label" for="nama">Nama kamu</label>
          <select class="form-select" id="nama"></select>
          <div class="form-text">Pastikan namamu sudah benar sebelum masuk.</div>
        </div>
        <button class="btn btn-info w-100" id="btnLogin" type="submit">Masuk</button>
        <button class="btn btn-link btn-sm w-100 mt-2" id="btnGantiKelas" type="button">← Ganti kelas</button>
      </form>

      <div class="small text-warning mt-2" id="loginMsg"></div>
    </div>
  </section>

  <!-- Hub -->
  <section class="screen" id="screen-hub" hidden>
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h4 class="mb-0">Markas Agen</h4>
      <div class="keys" id="keys"></div>
    </div>
    <div class="progress mb-1" style="height:8px"><div class="progress-bar" id="hubProgress" style="width:0"></div></div>
    <div class="small text-secondary mb-3" id="hubProgressText"></div>
    <div class="panel mb-3 d-flex align-items-center gap-3" id="materiEntry">
      <div class="fs-1" aria-hidden="true">📚</div>
      <div class="flex-grow-1">
        <h6 class="mb-1">Perpustakaan Materi</h6>
        <div class="small text-secondary" id="materiHint"></div>
      </div>
      <button class="btn btn-sm btn-outline-info" id="btnMateri" type="button">Baca</button>
    </div>
    <div class="row g-3" id="steps"></div>
  </section>

  <!-- Area bermain -->
  <section class="screen" id="screen-play" hidden>
    <button class="btn btn-sm btn-outline-secondary mb-3" id="btnBack">← Kembali ke markas</button>
    <div class="panel" id="play-area"></div>
  </section>

  <!-- Hasil -->
  <section class="screen text-center py-4" id="screen-result" hidden>
    <div class="panel mx-auto" style="max-width:420px">
      <h4 id="resultTitle"></h4>
      <div class="display-3 fw-bold text-info" id="resultScore"></div>
      <div class="my-2 fs-5" id="resultKey"></div>
      <button class="btn btn-info mt-3" id="btnResultNext">Lanjut</button>
    </div>
  </section>

</main>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/assessment.js"></script>
<script src="js/materi-data.js"></script>
<script src="js/materi.js"></script>
<script src="js/hasil.js"></script>
<script src="js/portal.js"></script>
<script src="js/guide.js"></script>
<script src="rooms/room1.js"></script>
<script src="rooms/room2.js"></script>
<script src="rooms/room3.js"></script>
<script src="rooms/room4.js"></script>
<script src="rooms/room5.js"></script>
<script src="js/game.js"></script>
</body>
</html>
